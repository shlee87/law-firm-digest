          EOF

      - name: Run weekly digest pipeline
        id: run_pipeline
        run: pnpm tsx src/main.ts --mode=weekly
        env:
          # Gemini API secret deliberately omitted — weekly never calls the
          # summarizer (D-22 [METRIC] geminiCallCount=0 always). If a future
          # plan wires re-summarization or hint generation into weekly, re-add
          # the env entry alongside daily.yml's pattern.
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          NODE_EXTRA_CA_CERTS: /tmp/thawte-tls-rsa-ca-g1.pem

      - uses: stefanzweifel/git-auto-commit-action@v7
        with:
          # Phase 13 D-23: weekly atomic commit covers pending truncate + seen
          # lastUpdated + new archive HTML. Same atomicity rationale as daily.
          commit_message: 'chore(state): weekly — sent digest, truncate pending [skip ci]'
          file_pattern: 'state/pending.json state/seen.json archive/**/*.html'

      - name: Open issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "Weekly digest failed — run ${{ github.run_id }}" \
            --body "$(cat <<'EOF'
          **Workflow run:** https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          **Commit:** ${{ github.sha }}
          **Triggered by:** ${{ github.event_name }}
          **Started:** ${{ github.event.repository.updated_at }}

          ## Likely causes (check in order)

          | Symptom in logs | Fix |
          |-----------------|-----|
          | \`ZodError ... pending.json\` or \`Unsupported pending version\` | state/pending.json 형식 오류 — daily 가 만든 schema 와 weekly 의 zod schema 불일치 가능성. 코드 변경 없이 \`state/pending.json\` 백업 후 \`[]\`로 초기화하여 다음 weekly 가 empty heartbeat 발송하도록 복구 |
          | \`535 5.7.8\` or \`GMAIL_AUTH_FAILURE\` | App Password 만료/폐기 — https://myaccount.google.com/apppasswords 에서 재발급 후 \`GMAIL_APP_PASSWORD\` secret 업데이트 |
          | \`ZodError ... recipient\` | \`RECIPIENT_EMAIL\` 형식 오류 — Settings → Secrets 에서 수정 |
          | \`ZodError ... firms\` | \`config/firms.yaml\` 형식 오류 |
          | \`ENOENT.*pending.json\` | first-run 또는 pending 파일 부재 — 정상 동작 (heartbeat 발송) 아닌 다른 에러면 daily 가 한 번도 안 돌았다는 신호 |

          ## Next steps

          1. 위 run 링크에서 전체 로그 확인
          2. 원인 파악 후 수정
          3. Actions 탭 → "Weekly Digest" → **Run workflow** 로 수동 재실행
          4. 재실행 성공 확인 후 이 issue close

          ---
          _Auto-created by .github/workflows/weekly.yml failure step._
          EOF
          )"
